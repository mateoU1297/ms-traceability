server:
  port: 8084
  servlet:
    context-path: /api/v1/traceability

spring:
  application:
    name: ms-traceability
  data:
    mongodb:
      uri: mongodb://localhost:27017/traceability_db
      auto-index-creation: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
  server-url: http://localhost:8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${random.value}