components:
  schemas:
    TraceResponse:
      type: object
      properties:
        id:
          type: string
          example: "65f1a2b3c4d5e6f7a8b9c0d1"
        orderId:
          type: integer
          format: int64
          example: 1
        clientId:
          type: integer
          format: int64
          example: 5
        previousStatus:
          type: string
          example: "PENDING"
        newStatus:
          type: string
          example: "IN_PREPARATION"
        changedAt:
          type: string
          format: date-time
          example: "2026-03-14T10:30:45.123Z"

    OrderEfficiencyResponse:
      type: object
      properties:
        orderId:
          type: integer
          format: int64
          example: 1
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          format: int64
          example: 45

    EmployeeEfficiencyResponse:
      type: object
      properties:
        employeeId:
          type: integer
          format: int64
          example: 20
        averageDurationMinutes:
          type: number
          format: double
          example: 32.5
        totalOrders:
          type: integer
          format: int64
          example: 10