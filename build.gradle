plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.11'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.openapi.generator' version '7.10.0'
}

openApiGenerate {
	generatorName = "spring"
	inputSpec = "$rootDir/src/main/resources/openapi/traceability-api.yaml"
	outputDir = "$buildDir/generated"
	apiPackage = "com.pragma.traceability.infrastructure.adapter.in.rest.api"
	modelPackage = "com.pragma.traceability.application.dto"
	invokerPackage = "com.pragma.traceability.infrastructure"

	configOptions = [
			dateLibrary: "java17",
			java17: "true",
			useSpringBoot3: "true",
			useJakartaEe: "true",
			useSwaggerUI: "true",
			skipDefaultInterface: "false",
			interfaceOnly: "true",
			delegatePattern: "true",
			useTags: "true",
			library: "spring-boot",
			serializableModel: "true",
			jakarta: "true",
			useBeanValidation: "true",
			performBeanValidation: "true"
	]

	globalProperties = [
			modelDocs: "false",
			apis: "",
			models: "",
			supportingFiles: "ApiUtil.java"
	]
}

compileJava.dependsOn tasks.openApiGenerate

sourceSets {
	main {
		java {
			srcDir "${buildDir}/generated/src/main/java"
		}
	}
}

group = 'com.pragma'
version = '0.0.1-SNAPSHOT'
description = 'ms traceability for plazoleta de comidas'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2025.0.0")
}


dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'
	implementation 'org.springdoc:springdoc-openapi-starter-common:2.8.13'
	implementation 'org.openapitools:jackson-databind-nullable:0.2.6'

	implementation 'org.mapstruct:mapstruct:1.5.5.Final'

	compileOnly 'org.projectlombok:lombok'

	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.testcontainers:testcontainers:1.19.3'
	testImplementation 'org.testcontainers:junit-jupiter:1.19.3'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
